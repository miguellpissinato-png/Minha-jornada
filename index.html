<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170f2e"><meta name="description" content="Trilha de estudos para o 2º dia do Enem em pixel art."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Minha Jornada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cenário 2D em pixel art em tela cheia (canvas de baixa resolução ampliado sem suavização). Duas abas: Acampamento (resumo numa placa à esquerda no desktop, folha inferior no celular)
   e Estudos (só o cenário, o timer de nuvens no céu e um cartão de controles embaixo). Navegação em pílula no topo (desktop) ou barra inferior (celular). */
:root{
  color-scheme:dark;
  --night:#170f2e; --panel:rgba(30,20,56,.97); --card:#2a1d4a; --line:#5b4691;
  --bone:#f7ecd8; --bone-dim:#b9abd8; --lantern:#ff9a3c; --lantern-ink:#2a1206; --lantern-deep:#b8581a;
  --moss:#8fd46a; --ember:#ff6a3a; --cloth:#d8433b;
  --mat:#6fb6e8; --fis:#ffc24a; --qui:#d08af0; --bio:#8fd46a; --rev:#f7ecd8;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --nav-h:66px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
body.flat{background:linear-gradient(#2a1a5a,#e85a8a 40%,#ff8a3c 46%,#3f6f45 46.5%,#1e1438)}
#world{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
h1,h2,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.plate{background:var(--panel);border:2px solid var(--line);border-radius:16px}
.bar{height:10px;border-radius:99px;background:#2a3b45;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--lantern);transition:width .5s}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rev);flex:none}
.dot.mat,.bar i.mat{background:var(--mat)}.dot.fis,.bar i.fis{background:var(--fis)}.dot.qui,.bar i.qui{background:var(--qui)}.dot.bio,.bar i.bio{background:var(--bio)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 18px rgba(0,0,0,.35);margin-right:4px;white-space:nowrap;display:none}
.lvl{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;min-width:0}
.lvl-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lantern);color:var(--lantern-ink);font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.lvl-t{display:grid;gap:4px;width:158px;min-width:0}
.lvl-t div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1;white-space:nowrap}
.lvl-t b{font-weight:900}
.lvl-t span{color:var(--bone-dim);font-variant-numeric:tabular-nums;font-weight:700}
.lvl .bar{height:8px}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.chip b{font-weight:900;font-size:15px}
.chip span{color:var(--bone-dim)}
.chip svg{width:16px;height:16px;fill:var(--ember)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--bone);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"] .on{display:none}
.icon-btn[aria-pressed="true"] .off{display:none}

/* navegação */
#nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--panel);border-top:2px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:2px solid transparent;font-weight:900;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--bone-dim)}
#nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-selected="true"]{background:rgba(242,180,65,.14);border-color:var(--lantern);color:var(--lantern)}

/* acampamento */
#camp{position:fixed;z-index:4;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));max-height:52%;overflow:auto;overscroll-behavior:contain;
  border-radius:22px 22px 0 0;border-bottom:0;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#grip{display:block;width:100%;height:22px}
#grip::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:#4a5d68;margin:0 auto}
#camp.min .fold{display:none}
#camp.min .primary{margin-top:12px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-dim)}
.big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.02;margin:2px 0 2px;text-wrap:balance}
.big b{color:var(--lantern);font-weight:800;font-size:1.25em}
.sub{font-size:13px;color:var(--bone-dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.stats small{display:block;font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-dim)}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{display:block;font-size:11.5px;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-dim);margin:18px 0 8px}
.journey{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;position:relative;overflow-x:auto;padding:4px 2px}
.journey::before{content:"";position:absolute;left:20px;right:20px;top:22px;height:4px;border-radius:9px;background:#2a3b45}
.journey li{position:relative;display:grid;justify-items:center;gap:4px;flex:1;min-width:42px}
.journey i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:15px;background:#22323c;border:3px solid #3b4e59;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.journey small{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--bone-dim)}
.journey .done i{background:var(--moss);border-color:#5aa94a;color:#12240f}
.journey .gold i{background:var(--lantern);border-color:var(--lantern-deep);color:var(--lantern-ink)}
.journey .today i{border-color:var(--lantern);color:var(--bone);box-shadow:0 0 0 4px rgba(242,180,65,.22)}
.journey .missed i{border-style:dashed;opacity:.7}
.journey .exam i{background:var(--cloth);border-color:#8a2a36;color:var(--bone);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:13px;box-shadow:0 3px 0 #223039}
.chips button[aria-checked="true"]{border-color:var(--lantern);background:rgba(242,180,65,.14);color:var(--lantern);box-shadow:0 3px 0 var(--lantern-deep)}
.topics{display:grid;gap:6px;margin:10px 0 12px}
.topics li{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.topics li>div{min-width:0;flex:1}
.topics b{display:block;font-weight:800;font-size:14px;line-height:1.25}
.topics small{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--bone-dim);font-weight:700}
.topics li.done b{text-decoration:line-through;color:var(--bone-dim)}
.topics li.now{border-color:var(--lantern)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #56707d;display:grid;place-items:center;flex:none;margin-top:1px}
.chk svg{width:15px;height:15px;fill:none;stroke:#12240f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk[aria-pressed="true"]{background:var(--moss);border-color:var(--moss)}
.chk[aria-pressed="true"] svg{opacity:1}
.primary{display:block;width:100%;padding:13px 16px;border-radius:14px;background:var(--lantern);color:var(--lantern-ink);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--lantern-deep);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lantern-deep)}
.primary:disabled{opacity:.6}
.ghost{padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:14px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 #223039}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #223039}
.subjects{display:grid;gap:10px}
.subjects li{display:grid;gap:5px}
.subjects div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800}
.subjects span{color:var(--bone-dim);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
details{margin-top:14px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
summary{padding:11px 12px;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
details>div{padding:0 12px 12px}
.week{display:grid;gap:8px}
.day{padding:9px 10px;border-radius:12px;background:#22323c}
.day.today{box-shadow:inset 0 0 0 2px var(--lantern)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.d-head b{font-weight:900}
.d-head small{display:block;font-size:12px;color:var(--bone-dim)}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:32px;height:32px;border-radius:10px;background:#31444f;font-weight:900;font-size:18px;line-height:1}
.stepper output{min-width:54px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.mini{display:grid;gap:4px;margin-top:8px;font-size:13px}
.mini li{display:flex;align-items:baseline;gap:7px;min-width:0}
.mini li span{flex:1;min-width:0}
.mini li.done{color:var(--bone-dim)}
.mini button{font-size:12px;font-weight:800;color:var(--bone-dim);text-decoration:underline;flex:none}
.note{margin-top:10px;font-size:12.5px;color:var(--bone-dim)}

/* estudos */
#study{position:fixed;inset:0;z-index:4;pointer-events:none}
.st-card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));padding:12px;border-radius:18px;pointer-events:auto;display:grid;gap:10px}
.st-topic{display:flex;gap:12px;align-items:flex-start}
.st-topic>div{flex:1;min-width:0}
.st-topic small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.st-topic b{display:block;font-weight:900;font-size:16px;line-height:1.25;margin-top:2px}
.st-topic p{font-size:13px;color:var(--bone-dim);margin-top:2px}
#stDone{padding:9px 12px;border-radius:12px;background:var(--moss);color:#12240f;font-weight:900;font-size:13px;white-space:nowrap;flex:none;box-shadow:0 3px 0 #4f9a40}
.meter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:12px;color:var(--bone-dim);font-variant-numeric:tabular-nums;font-weight:700}
.st-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.st-actions.one{grid-template-columns:1fr}
.link{font-size:12.5px;font-weight:800;color:var(--bone-dim);text-decoration:underline;justify-self:center;padding:2px 8px}
#flat{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(72px,22vw,200px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* resultado e avisos */
#result{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(8,14,18,.62);padding:16px}
.res-card{width:min(400px,100%);padding:22px 20px 20px;border-radius:22px;text-align:center;display:grid;gap:12px;background:#15222a}
.res-card h2{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;text-wrap:balance}
.res-xp{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:var(--lantern)}
.res-card p{color:var(--bone-dim)}
#toast{position:fixed;z-index:9;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);padding:10px 16px;border-radius:99px;background:var(--bone);color:#1b2a22;font-weight:900;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fade{position:fixed;inset:0;z-index:7;background:#0a1116;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
body.tab-study #camp{display:none}
body.tab-camp #study{display:none}

@media (max-width:999px){
  .chip span{display:none}
  .chip{padding:7px 10px}
  .lvl-t{width:112px}
  .lvl-t b{display:none}
}
@media (min-width:1000px){
  :root{--nav-h:0px}
  #nav{left:50%;right:auto;bottom:auto;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:300px;padding:5px;border:2px solid var(--line);border-radius:18px;gap:5px}
  #nav button{height:38px;font-size:12.5px;border-radius:12px}
  #nav button svg{width:20px;height:20px}
  #camp{left:max(16px,env(safe-area-inset-left,0px));right:auto;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:404px;max-height:none;border-radius:20px;border-bottom:2px solid var(--line);padding:16px}
  #grip{display:none}
  .st-card{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1240px){.brand{display:block}}
/* 8 bits: cantos retos, bordas grossas, sombra em degrau */
.plate,.stats div,.topics li,.chips button,.primary,.ghost,details,.day,.stepper button,.chk,#stDone,#nav button,.res-card,#toast,.bar,.bar i,.lvl-n,.journey i,.journey .exam i,.dot,#camp,.st-card{border-radius:0}
.plate{border-width:3px;box-shadow:0 4px 0 rgba(10,6,26,.55)}
#nav{box-shadow:none}
body{font-size:16px}
.bar{background:#3a2a66}.journey::before{background:#3a2a66}.journey i{background:#33245c;border-color:#5b4691}
.chips button,.ghost{box-shadow:0 4px 0 #1c1238}.stepper button{background:#45327a}.day{background:#33245c}
.chk{border-color:#8a76c2}.stats b,.big,.res-card h2,.res-xp,.brand,.lvl-n{font-weight:700}
.eyebrow,.sec,.stats small{letter-spacing:.06em}
@media (max-height:640px){.st-topic p,.link{display:none}.st-card{gap:8px;padding:10px}}
@media (prefers-reduced-motion:reduce){.bar i,#toast,#fade,.primary,.ghost{transition:none}}
</style>

</head><body><canvas id="world" aria-hidden="true"></canvas>

<header id="hud">
  <div class="brand">Minha Jornada</div>
  <div class="lvl plate" id="lvl">
    <div class="lvl-n" id="lvlN">1</div>
    <div class="lvl-t"><div><b id="lvlName">Camponês</b><span id="xpTxt">0 XP</span></div><div class="bar"><i id="xpBar"></i></div></div>
  </div>
  <div class="spacer"></div>
  <div class="chip plate" id="streak" title="Dias seguidos estudando"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.500 5 10.500A5 5 0 0 1 12 22a5 5 0 0 1-5-5c0-2.200 1.200-3.600 2.200-4.800C10.400 10.800 11.600 8 12 2z"/></svg><b id="streakN">0</b><span>dias seguidos</span></div>
  <div class="chip plate" id="left"><b id="leftN">6 dias</b><span>até a prova</span></div>
  <button class="icon-btn plate" id="snd" aria-pressed="true" aria-label="Música">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</header>

<main id="camp" class="plate" aria-label="Acampamento">
  <button id="grip" aria-label="Recolher ou abrir o resumo"></button>
  <div id="campBody"></div>
</main>

<section id="study" aria-label="Estudos">
  <div id="flat" hidden>00:00</div>
  <span class="sr" id="srTimer" role="timer"></span>
  <div class="st-card plate" id="stCard"></div>
</section>

<nav id="nav" role="tablist" aria-label="Telas">
  <button role="tab" data-tab="camp" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20L12 4l9 16H3z"/><path d="M12 20v-5M9.500 20l2.500-5 2.500 5"/></svg>Acampamento</button>
  <button role="tab" data-tab="study" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.500C6.500 4.500 9.500 4.500 12 6c2.500-1.500 5.500-1.500 8-.500V19c-2.500-1-5.500-1-8 .500-2.500-1.500-5.500-1.500-8-.500V5.500z"/><path d="M12 6v13.500"/></svg>Estudos</button>
</nav>

<div id="result" hidden role="dialog" aria-modal="true" aria-labelledby="resTitle">
  <div class="res-card plate"><h2 id="resTitle"></h2><div class="res-xp" id="resXp"></div><p id="resBody"></p><button class="primary" id="resOk">Voltar ao acampamento</button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fade"></div>

<script>
(function(){
'use strict';
/* ───────── utilidades ───────── */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const today=()=>keyOf(new Date());
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const WD3=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtDur=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?pad(r):'')};

function defaults(){

}
function valid(s){return s&&s.v===1&&typeof s.start==='string'&&typeof s.exam==='string'&&s.log&&s.done&&s.hours}

/* nuvem: um documento privado por pessoa, para o progresso seguir entre celular e computador */
const cloud={ref:null,status:'local',writing:false,dirty:false,timer:0};
function setSync(){const el=$('#sync');if(el)el.textContent=cloud.status==='cloud'?'Salvo na sua conta':cloud.status==='wait'?'Sincronizando…':'Salvo neste aparelho'}
function pushCloud(){
  if(!cloud.ref)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(async function run(){
    if(cloud.writing){cloud.dirty=true;return}
    cloud.writing=true;cloud.dirty=false;
    try{await cloud.ref.set(JSON.parse(JSON.stringify(state)));cloud.status='cloud'}
    catch(e){if(e&&e.code==='invalid_argument'){cloud.ref=null}cloud.status='local'}
    cloud.writing=false;setSync();
    if(cloud.dirty&&cloud.ref)run();
  },1500);
}
async function pullCloud(){
  if(!cloud.ref)return;
  try{
    const snap=await cloud.ref.get();
    if(snap.exists){
      const r=snap.data();
      if(valid(r)&&(r.updatedAt||0)>(state.updatedAt||0)){state=JSON.parse(JSON.stringify(r));saveLocal();onStateReplaced()}
      else if((state.updatedAt||0)>((r&&r.updatedAt)||0))pushCloud();
    }else if(state.updatedAt)pushCloud();
    cloud.status='cloud';
  }catch(e){cloud.status='local'}
  setSync();
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    cloud.status='wait';setSync();
    const giveUp=setTimeout(()=>{if(cloud.status==='wait'){cloud.status='local';setSync()}},10000);
    const both=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=both[0],user=both[1];
    const uid=db&&user?await user.id():null;
    if(!uid){clearTimeout(giveUp);cloud.status='local';setSync();return}
    cloud.ref=db.doc('data/users/'+uid+'/save');
    await pullCloud();clearTimeout(giveUp);
  }catch(e){cloud.status='local';setSync()}
}
function touch(){state.updatedAt=Date.now();saveLocal();pushCloud()}

/* ───────── regras: tempo, plano, XP ───────── */
function hoursFor(k){const h=state.hours[k];if(typeof h==='number')return h;return[180,90,90,90,90,90,180][dateOf(k).getDay()]}
function sessElapsed(){const s=state.session;if(!s)return 0;return s.acc+(s.t0?Math.min((Date.now()-s.t0)/1000,3*3600):0)}
function daySec(k){const l=state.log[k];return(l&&l.sec||0)+(state.session&&state.session.day===k?sessElapsed():0)}
function advanced(k){const l=state.log[k];return daySec(k)>=ADV||!!(l&&l.arrived)}
let plan=null;
function buildPlan(){
  const t=today(),n=diffDays(state.start,state.exam),days=[];
  for(let i=0;i<=n;i++){const key=addDays(state.start,i);days.push({key,i,isExam:i===n,goal:i===n?0:hoursFor(key),topics:[],past:key<t,isToday:key===t})}
  for(const id in state.done){const d=days.find(x=>x.key===state.done[id]);if(d&&BYID[id]&&!d.isExam)d.topics.push(BYID[id])}
  const queue=TOPICS.filter(x=>!state.done[x.id]);
  const eve=n>0?days[n-1]:null;
  days.forEach(d=>{
    if(d.isExam||d.key<t)return;
    let used=d.topics.reduce((s,x)=>s+x.min,0),cap=d.goal;
    const rev=d===eve?REVIEW.filter(x=>!state.done[x.id]):[];
    if(d===eve)cap-=rev.reduce((s,x)=>s+x.min,0);
    while(queue.length&&used+queue[0].min<=cap+10){const x=queue.shift();d.topics.push(x);used+=x.min}
    if(d!==eve&&!d.topics.length&&queue.length&&d.goal>=15)d.topics.push(queue.shift());
    rev.forEach(x=>d.topics.push(x));
  });
  return{days,overflow:queue};
}
function xpTotal(){
  let x=Object.keys(state.done).length*20;const keys=new Set(Object.keys(state.log));if(state.session)keys.add(state.session.day);
  keys.forEach(k=>{const s=daySec(k),l=state.log[k]||{};x+=Math.floor(s/60)*2;if(s>=ADV)x+=30;if(l.goal)x+=50;if(l.arrived)x+=100});
  return x;
}
function levelOf(x){let i=0;while(i<LV.length-1&&x>=LV[i+1])i++;const a=LV[i],b=LV[i+1]||a;return{n:i+1,name:LVN[i],a,b,f:b>a?(x-a)/(b-a):1}}
function streak(){let k=today(),n=0;if(!advanced(k))k=addDays(k,-1);while(advanced(k)){n++;k=addDays(k,-1)}return n}
function targetIndex(){let idx=-1;plan.days.forEach(d=>{if(advanced(d.key))idx=d.i});return idx}
function todayDay(){const t=today();return plan.days.find(d=>d.key===t)||null}
/* céu pelo progresso da meta: azul na maior parte, escurece nos últimos 20% e vira noite estrelada quando a meta é batida */
function clockTarget(){const d=todayDay();if(!d||d.isExam||!d.goal)return .32;const p=daySec(d.key)/(d.goal*60);return p>=1?1.22:p<.8?lerp(.14,.7,p/.8):lerp(.7,1,(p-.8)/.2)}

/* ───────── música medieval sintetizada ───────── */
const Music=(function(){
  let ctx=null,master=null,bus=null,timer=0,step=0,nextT=0,pass=0,birdT=0,isDay=true,vol=.5,fireOn=false,noise=null;
  const E=.27,mtof=m=>440*Math.pow(2,(m-69)/12);
  const BARS=[[[62,2],[65,1],[69,2],[67,1]],[[65,2],[64,1],[62,3]],[[65,2],[67,1],[69,2],[72,1]],[[71,2],[69,1],[69,3]],
   [[74,2],[72,1],[69,2],[67,1]],[[65,2],[67,1],[69,3]],[[67,2],[65,1],[64,2],[60,1]],[[62,3],[62,3]],
   [[69,2],[69,1],[72,2],[69,1]],[[67,2],[65,1],[67,3]],[[65,2],[65,1],[69,2],[65,1]],[[64,2],[62,1],[64,3]],
   [[62,2],[65,1],[69,2],[74,1]],[[72,2],[69,1],[67,3]],[[65,2],[64,1],[62,2],[60,1]],[[62,6]]];
  const MEL={};BARS.forEach((b,bi)=>{let s=bi*6;b.forEach(n=>{MEL[s]=n;s+=n[1]})});
  const CH={Dm:[38,50,57,62,65],F:[41,53,57,60,65],Am:[45,52,57,60,64],C:[36,48,55,60,64]};
  const PROG=['Dm','Dm','F','Am','Dm','F','C','Dm','Am','C','F','Am','Dm','C','Dm','Dm'];
  const ARP=[0,3,4,1,3,2];
  function pluck(t,m,v){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='triangle';o2.type='sawtooth';o.frequency.value=o2.frequency.value=mtof(m);o2.detune.value=6;g2.gain.value=.22;
    f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(500,t+.5);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*.28,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+1.1);
    o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(bus);o.start(t);o2.start(t);o.stop(t+1.15);o2.stop(t+1.15);
  }
  function flute(t,m,dur){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
    const fr=mtof(m);o.type='sine';o2.type='triangle';o.frequency.value=o2.frequency.value=fr;g2.gain.value=.18;
    l.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fr*.006,t+.25);l.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.13,t+.06);g.gain.setValueAtTime(.11,t+Math.max(.07,dur-.08));g.gain.linearRampToValueAtTime(.0001,t+dur+.06);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(bus);[o,o2,l].forEach(n=>{n.start(t);n.stop(t+dur+.1)});
  }
  function drum(t,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(52,t+.16);
    g.gain.setValueAtTime(v*.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.26)}
  function chirp(t){const n=2+Math.floor(Math.random()*3),f0=2600+Math.random()*1600;for(let i=0;i<n;i++){const o=ctx.createOscillator(),g=ctx.createGain(),a=t+i*.12;
    o.type='sine';o.frequency.setValueAtTime(f0,a);o.frequency.exponentialRampToValueAtTime(f0*1.28,a+.07);g.gain.setValueAtTime(.0001,a);g.gain.linearRampToValueAtTime(.03,a+.02);g.gain.linearRampToValueAtTime(.0001,a+.09);
    o.connect(g);g.connect(master);o.start(a);o.stop(a+.1)}}
  function crackle(t){const src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();src.buffer=noise;f.type='bandpass';f.frequency.value=900+Math.random()*2600;f.Q.value=1.2;
    const v=.02+Math.random()*.05;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.04+Math.random()*.06);src.connect(f);f.connect(g);g.connect(master);src.start(t,Math.random()*.8,.12)}
  function playStep(s,t){
    const bar=Math.floor(s/6),k=s%6,ch=CH[PROG[bar]],mode=pass%3;
    if(k===0)pluck(t,ch[0],.9);
    pluck(t,ch[ARP[k]],k===0?.55:.42);
    if(mode!==0&&MEL[s])flute(t,MEL[s][0],MEL[s][1]*E*.94);
    if(mode===2&&(k===0||k===3))drum(t,k===0?.8:.45);
  }
  function tick(){
    if(!ctx||ctx.state!=='running')return;
    if(nextT<ctx.currentTime)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.5){playStep(step,nextT);nextT+=E;step=(step+1)%96;if(step===0)pass++}
    if(fireOn&&Math.random()<.5)crackle(ctx.currentTime+Math.random()*.1);
    if(isDay&&ctx.currentTime>birdT){chirp(ctx.currentTime+.05);birdT=ctx.currentTime+5+Math.random()*9}
  }
  function build(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    bus=ctx.createGain();bus.connect(master);
    const d=ctx.createDelay(1),fb=ctx.createGain(),lp=ctx.createBiquadFilter(),wet=ctx.createGain();
    d.delayTime.value=.31;fb.gain.value=.3;lp.type='lowpass';lp.frequency.value=1700;wet.gain.value=.26;
    bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(master);
    const dr=ctx.createGain();dr.gain.value=.035;dr.connect(bus);
    [[38,'triangle'],[45,'sine']].forEach(p=>{const o=ctx.createOscillator();o.type=p[1];o.frequency.value=mtof(p[0]);o.connect(dr);o.start()});
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);{const ch=noise.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
    birdT=ctx.currentTime+3;timer=setInterval(tick,100);return true;
  }
  return{
    setOn(on){
      if(on){if(!ctx&&!build())return;ctx.resume();master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(vol,ctx.currentTime,.5)}
      else if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0,ctx.currentTime,.12)}
    },
    setDay(b){isDay=b},setFire(b){fireOn=b},
    sfx(name){
      if(!ctx||ctx.state!=='running'||!state.sound)return;const t=ctx.currentTime+.03;
      const seq=name==='adv'?[62,65,69,74]:name==='goal'?[62,69,74,77,81]:[81];
      seq.forEach((m,i)=>pluck(t+i*(name==='goal'?.13:.09),m+12,1));
    }
  };
})();

/* ───────── mundo 2D em pixel art ───────── */
const World=(function(){
  const canvas=$('#world'),ctx=canvas.getContext?canvas.getContext('2d'):null;if(!ctx)return null;
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return{c,x:c.getContext('2d')}};
  let W=320,HH=200,SC=4,wc=mk(8,8),tc=mk(8,8),skyc=mk(8,8),skyKey='';
  const SKW=80,SKH=60,OX=34,OY=54,skc=mk(SKW,SKH),shc=mk(SKW,SKH);
  const TAU=Math.PI*2;
  const rgb=h=>[h>>16&255,h>>8&255,h&255],mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],css=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
  const hash=(i,s)=>{let x=Math.imul((i|0)^Math.imul(s|0,374761393),668265263);x=Math.imul(x^(x>>>13),1274126177);x^=x>>>16;return(x>>>0)/4294967296};
  const R=(x,c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.max(0,Math.round(w)),Math.max(0,Math.round(h)))};
  const disc=(x,c,cx,cy,r)=>{x.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.max(0,Math.round(r));for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy)+.4);x.fillRect(cx-dx,cy+dy,dx*2+1,1)}};
  const seg=(x,c,x0,y0,x1,y1,th)=>{x.fillStyle=c;const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))),o=th>>1;for(let i=0;i<=n;i++){const t=i/n;x.fillRect(Math.round(x0+(x1-x0)*t)-o,Math.round(y0+(y1-y0)*t)-o,th,th)}};
  function sprite(rows,pal){const h=rows.length,w=rows[0].length,s=mk(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=='.'&&pal[ch]){s.x.fillStyle=pal[ch];s.x.fillRect(x,y,1,1)}}return s.c}

  /* ── sprites gerados ── */
  function pine(h,pal){const w=(Math.round(h*.5)|1)+2,s=mk(w,h),x=s.x,cx=w>>1,tw=h>34?3:2,t0=Math.round(h*.35);
    R(x,pal.t,cx-(tw>>1),t0,tw,h-t0);
    const tier=h>34?8:6,bot=h-Math.max(3,Math.round(h*.12));
    for(let y=1;y<bot;y++){const t=(y-1)/(bot-1),k=((y-1)%tier)/tier,hw=Math.max(0,Math.round((w/2-1)*(.16+.84*t)*(.45+.55*k)));
      R(x,pal.m,cx-hw,y,hw*2+1,1);
      if(hw>1){R(x,pal.l,cx-hw,y,Math.max(1,Math.round(hw*.5)),1);R(x,pal.d,cx+Math.round(hw*.4),y,hw-Math.round(hw*.4)+1,1)}
      if(k>.8&&hw>2)R(x,pal.d,cx-hw+1,y,hw*2-1,1)}
    return s.c}
  function leafy(r,pal,seed){const w=r*2+7,th=Math.round(r*.9)+3,h=r*2+th,s=mk(w,h),x=s.x,cx=w>>1;
    R(x,pal.t,cx-1,r*2-3,3,th+3);R(x,pal.td,cx+1,r*2-3,1,th+3);
    const bl=[[0,0,r],[-r*.55,r*.3,r*.62],[r*.55,r*.25,r*.66],[0,-r*.22,r*.7]];
    bl.forEach(b=>disc(x,pal.d,cx+b[0]+1,r+b[1]+1,b[2]));bl.forEach(b=>disc(x,pal.m,cx+b[0],r+b[1],b[2]));
    bl.forEach(b=>disc(x,pal.l,cx+b[0]-b[2]*.3,r+b[1]-b[2]*.32,b[2]*.48));

    if(N>.05)for(let i=0;i<26;i++){const bl=Math.sin(time*(1.5+hash(i,71)*2)+i*2);if(bl>0){ctx.globalAlpha=N*bl;R(ctx,'#f6ff9a',hash(i,72)*W+Math.sin(time*.5+i)*5,gy-34+hash(i,73)*44+Math.sin(time*.8+i*2)*3,1,1)}}
    ctx.globalAlpha=1;
  }
  function drawRabbit(w){
    rab.x-=SPEED*walkW*DT;let air=0;
    if(rab.rest>0)rab.rest-=DT;else{rab.hop+=DT/.3;const q=Math.min(1,rab.hop);air=Math.sin(Math.PI*q)*4;rab.x-=13.5*DT;rab.y+=12.6*DT;if(rab.hop>=1){rab.hop=0;rab.n++;rab.rest=rab.n===6?1:.07+Math.random()*.1}}
    rabbit(w,Math.round(rab.x),Math.round(rab.y),air);if(rab.y>gy+26||rab.x<-12)rab.on=false}

  function layout(fr){
    if(fr)free=fr;const iw=innerWidth,ih=innerHeight;SC=clamp(Math.round(Math.min(ih,iw*1.6)/205),2,8);
    const nw=Math.ceil(iw/SC),nh=Math.ceil(ih/SC);
    if(nw!==W||nh!==HH||canvas.width!==nw){W=nw;HH=nh;canvas.width=W;canvas.height=HH;canvas.style.width=W*SC+'px';canvas.style.height=HH*SC+'px';wc=mk(W,HH);tc=mk(W,HH);skyc=mk(W,HH);skyKey=''}
    [ctx,wc.x,tc.x,skyc.x,skc.x,shc.x].forEach(x=>x.imageSmoothingEnabled=false);
    fl=free.l/SC;ft=free.t/SC;fw=Math.max(40,(iw-free.l-free.r)/SC);fbY=HH-free.b/SC;cx=Math.round(fl+fw/2);
    const fh=Math.max(40,fbY-ft);gy=Math.round(fbY-clamp(fh*.16,12,24));hy=Math.round(gy-clamp(fh*.2,18,34));skyH=Math.max(20,hy-ft);skyKey='';
  }
  function setMode(m){mode=m;const cp=m==='camp'||m==='rest';walkOn=m==='walk';if(cp){car.on=false;rab.on=false;birds.on=false}Music.setFire(cp)}
  return{layout,setMode,setTimer(t,show){tText=t;tShow=show},setSign(s){sign=String(s).toUpperCase().replace('É HOJE','HOJE').replace('PROVA FEITA','FEITA')},setClock(c){clockGoal=c},jumpClock(c){clockShown=c},start(){requestAnimationFrame(frame)}};
})();

/* ───────── interface ───────── */
let tab='camp',sessXp0=0;
const crossed={adv:{}},openDet={};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>';
function currentTopic(){
  const sub=state.subject;if(sub&&sub!=='auto')return TOPICS.find(x=>x.s===sub&&!state.done[x.id])||null;
  const d=todayDay(),t=d&&d.topics.find(x=>!state.done[x.id]);return t||TOPICS.find(x=>!state.done[x.id])||null}
function curSubj(){const tp=currentTopic();return tp?tp.s:(state.subject&&state.subject!=='auto'?state.subject:'rev')}
function attribute(){const s=state.session;if(!s)return;const el=sessElapsed(),d=el-(s.mark||0);if(d>0){const k=s.sub||'rev';state.subsec[k]=Math.round((state.subsec[k]||0)+d)}s.mark=el;s.sub=curSubj()}
function upcoming(){
  const sub=state.subject||'auto',t=today();
  if(sub==='auto'){const d=todayDay();let list=d&&!d.isExam?d.topics.slice():[];if(!list.length)list=TOPICS.filter(x=>!state.done[x.id]).slice(0,3);return list}
  return TOPICS.filter(x=>x.s===sub&&state.done[x.id]===t).concat(TOPICS.filter(x=>x.s===sub&&!state.done[x.id]).slice(0,3))}
function topicLi(t,now){const dn=!!state.done[t.id];return'<li class="'+(dn?'done':now?'now':'')+'"><button class="chk" data-topic="'+t.id+'" aria-pressed="'+dn+'" aria-label="Marcar como feito: '+t.name+'">'+CHECK+'</button><div><b>'+t.name+'</b><small><i class="dot '+t.s+'"></i>'+SUBJ[t.s]+(t.min?' · '+fmtDur(t.min):'')+'</small></div></li>'}
function leftText(){const left=diffDays(today(),state.exam);return left>1?left+' dias':left===1?'1 dia':left===0?'É hoje':'Prova feita'}
function renderHud(){
  const x=xpTotal(),l=levelOf(x);$('#lvlN').textContent=l.n;$('#lvlName').textContent=l.name;
  $('#xpTxt').textContent=l.b>l.a?x+' / '+l.b+' XP':x+' XP';$('#xpBar').style.width=Math.round(l.f*100)+'%';
  $('#streakN').textContent=streak();$('#leftN').textContent=leftText();
  $('#left').querySelector('span').textContent=diffDays(today(),state.exam)>0?'até a prova':'';
  $('#snd').setAttribute('aria-pressed',String(!!state.sound));
}
function dayStates(){const t=today();return plan.days.map(d=>{const l=state.log[d.key]||{};if(d.isExam)return l.arrived?'gold':d.isToday?'today exam':'exam';if(advanced(d.key))return l.goal?'gold':'done';if(d.isToday)return'today';return d.key<t?'missed':'future'})}
function weekHtml(){
  let h='<ul class="week">';
  plan.days.forEach(d=>{
    const dt=dateOf(d.key),name=WD[dt.getDay()].slice(0,3)+' '+dt.getDate(),sec=daySec(d.key);
    if(d.isExam){h+='<li class="day'+(d.isToday?' today':'')+'"><div class="d-head"><div><b>'+name+' · Prova</b><small>Matemática e Natureza · 13h30 às 18h30</small></div></div></li>';return}
    const st=d.past?(sec>=ADV?'Estudou '+fmtDur(sec/60):'Não estudou'):d.isToday?'Hoje · '+Math.floor(sec/60)+' min feitos':d.key===addDays(state.exam,-1)?'Véspera: revisão':'';
    h+='<li class="day'+(d.isToday?' today':'')+'"><div class="d-head"><div><b>'+name+'</b>'+(st?'<small>'+st+'</small>':'')+'</div>'+
      (d.past?'':'<div class="stepper"><button data-day="'+d.key+'" data-h="-15" aria-label="Menos 15 minutos em '+name+'">−</button><output>'+(d.goal?fmtDur(d.goal):'folga')+'</output><button data-day="'+d.key+'" data-h="15" aria-label="Mais 15 minutos em '+name+'">+</button></div>')+'</div>'+
      (d.topics.length?'<ul class="mini">'+d.topics.map(x=>'<li class="'+(state.done[x.id]?'done':'')+'"><i class="dot '+x.s+'"></i><span>'+x.name+'</span></li>').join('')+'</ul>':'')+'</li>';
  });
  h+='</ul>';
  if(plan.overflow.length)h+='<p class="sec">Não coube até a véspera</p><ul class="mini">'+plan.overflow.map(x=>'<li><i class="dot '+x.s+'"></i><span>'+x.name+'</span></li>').join('')+'</ul><p class="note">A lista segue a ordem do que mais cai. Aumente as horas de um dia para puxar mais tópicos, ou deixe estes de lado.</p>';
  return h;
}
function renderCamp(){
  const el=$('#campBody'),t=today(),dt=dateOf(t),d=todayDay(),left=diffDays(t,state.exam),ex=dateOf(state.exam),s=state.session;
  const total=Object.keys(state.log).reduce((a,k)=>a+(state.log[k].sec||0),0)+sessElapsed(),sec=daySec(t),doneN=TOPICS.filter(x=>state.done[x.id]).length,tp=currentTopic(),sub=state.subject||'auto';
  const head=left>0?'<b>'+left+'</b> '+(left===1?'dia':'dias')+' até a prova':left===0?'Hoje é o <b>dia da prova</b>':'Trilha <b>encerrada</b>';
  let h='<p class="eyebrow">'+WD[dt.getDay()]+', '+dt.getDate()+' de '+MES[dt.getMonth()]+'</p><h1 class="big">'+head+'</h1>'+
    '<p class="sub">'+WD[ex.getDay()]+', '+ex.getDate()+'/'+(ex.getMonth()+1)+' · Matemática e Ciências da Natureza'+(left===0?' · portões das 12h às 13h, prova das 13h30 às 18h30':'')+'</p>';
  h+='<div class="stats fold"><div><small>Estudado</small><b>'+fmtDur(total/60)+'</b><span>no total</span></div><div><small>Hoje</small><b>'+fmtDur(sec/60)+'</b><span>'+(d&&d.goal?'meta de '+fmtDur(d.goal):'sem meta')+'</span></div><div><small>Tópicos</small><b>'+doneN+'/'+TOPICS.length+'</b><span>concluídos</span></div></div>';
  const st=dayStates();
  h+='<h2 class="sec fold">Jornada</h2><ol class="journey fold">'+plan.days.map((x,i)=>{const dd=dateOf(x.key);return'<li class="'+st[i]+'"><i>'+dd.getDate()+'</i><small>'+(x.isExam?'PROVA':WD3[dd.getDay()])+'</small></li>'}).join('')+'</ol>';
  if(d&&d.isExam){
    const arr=!!(state.log[t]&&state.log[t].arrived);
    h+='<h2 class="sec">Para levar</h2><ul class="topics">'+EXAMLIST.map(x=>topicLi(x,false)).join('')+'</ul><button class="primary" id="arrive"'+(arr?' disabled':'')+'>'+(arr?'Ossinho chegou ao castelo':'Cheguei ao castelo')+'</button>';
  }else{
    h+='<h2 class="sec fold">Matéria de agora</h2><div class="chips fold" role="radiogroup" aria-label="Matéria para estudar">'+[['auto','Plano do dia'],['mat','Matemática'],['fis','Física'],['qui','Química'],['bio','Biologia']].map(q=>'<button role="radio" data-sub="'+q[0]+'" aria-checked="'+(sub===q[0])+'">'+(q[0]==='auto'?'':'<i class="dot '+q[0]+'"></i>')+q[1]+'</button>').join('')+'</div>';
    const list=upcoming();
    h+='<ul class="topics fold">'+(list.length?list.map(x=>topicLi(x,!!tp&&x.id===tp.id)).join(''):'<li><div><b>Tudo feito por aqui</b><small>Escolha outra matéria ou revise o que quiser.</small></div></li>')+'</ul>'+
      '<button class="primary" data-go="1">'+(s?(s.t0?'Voltar à trilha':'Retomar o estudo'):sec>0?'Continuar estudando':'Estudar agora')+'</button>';
  }
  h+='<h2 class="sec fold">O que você já estudou</h2><ul class="subjects fold">'+['mat','fis','qui','bio'].map(k=>{const all=TOPICS.filter(x=>x.s===k),dn=all.filter(x=>state.done[x.id]).length,ss=(state.subsec[k]||0)+(s&&s.sub===k?Math.max(0,sessElapsed()-(s.mark||0)):0);
    return'<li><div><b>'+SUBJ[k]+'</b><span>'+dn+' de '+all.length+' tópicos · '+fmtDur(ss/60)+'</span></div><div class="bar"><i class="'+k+'" style="width:'+(dn/all.length*100).toFixed(0)+'%"></i></div></li>'}).join('')+'</ul>';
  const dl=TOPICS.concat(REVIEW).filter(x=>state.done[x.id]);
  h+='<details class="fold" id="detDone"'+(openDet.detDone?' open':'')+'><summary>Tópicos concluídos ('+dl.length+')</summary><div>'+(dl.length?'<ul class="mini">'+dl.map(x=>'<li class="done"><i class="dot '+x.s+'"></i><span>'+x.name+'</span><button data-undo="'+x.id+'">desfazer</button></li>').join('')+'</ul>':'<p class="note">Nada concluído ainda. Marque um tópico quando terminar de estudá-lo.</p>')+'</div></details>';
  h+='<details class="fold" id="detWeek"'+(openDet.detWeek?' open':'')+'><summary>Semana e horas por dia</summary><div>'+weekHtml()+'</div></details>';
  h+='<p class="note fold">'+(advanced(t)?'Dia de hoje conquistado. ':'Estude 10 min para conquistar o dia na jornada. ')+'<span id="sync"></span></p>';
  el.innerHTML=h;setSync();
}
function renderStudy(){
  const el=$('#stCard'),s=state.session,tp=currentTopic(),d=todayDay(),k=s?s.day:today(),sec=daySec(k),goal=d&&!d.isExam?d.goal:0,running=!!(s&&s.t0);
  const key=[s?1:0,running,tp?tp.id:'',state.subject].join('|');
  if(key!==renderStudy.key){renderStudy.key=key;
    el.innerHTML='<div class="st-topic"><div><small><i class="dot '+(tp?tp.s:'rev')+'"></i><span>'+(tp?SUBJ[tp.s]:'Estudo livre')+'</span></small><b>'+(tp?tp.name:'Tudo desta matéria está feito')+'</b><p>'+(tp?tp.tip:'Revise o que quiser ou troque de matéria no acampamento.')+'</p></div>'+(tp&&s?'<button id="stDone">Concluí</button>':'')+'</div>'+
      (s?'<div class="meter"><div class="bar"><i id="stBar"></i></div><span id="stMsg"></span></div><div class="st-actions"><button class="ghost" id="stPause">'+(running?'Pausar':'Retomar')+'</button><button class="primary" id="stEnd">Encerrar</button></div>'
        :'<div class="st-actions one"><button class="primary" data-go="1">'+(sec>0?'Continuar estudando':'Começar a estudar')+'</button></div>')+
      '<button class="link" data-tab="camp">Trocar matéria</button>';
    layoutWorld()}
  if(s){let msg,pct;
    if(sec<ADV){msg='Faltam '+Math.ceil((ADV-sec)/60)+' min para conquistar o dia';pct=sec/ADV*100}
    else if(goal&&sec<goal*60){msg=Math.floor(sec/60)+' de '+goal+' min da meta';pct=sec/(goal*60)*100}
    else{msg=goal?'Meta do dia batida':Math.floor(sec/60)+' min hoje';pct=100}
    if(!running)msg='Na fogueira · '+msg;
    $('#stMsg').textContent=msg;$('#stBar').style.width=clamp(pct,0,100).toFixed(1)+'%'}
  const clock=fmtClock(sessElapsed());
  if(World)World.setTimer(clock,tab==='study');
  const fl=$('#flat');fl.hidden=!!World;fl.textContent=clock;
  const mm=Math.floor(sessElapsed()/60);if(renderStudy.mm!==mm){renderStudy.mm=mm;$('#srTimer').textContent=mm+' minutos de sessão'}
}
function renderAll(){plan=buildPlan();renderHud();if(tab==='camp'){renderCamp();if(World)World.setTimer('00:00',false)}else renderStudy();if(World)World.setSign(leftText())}
function layoutWorld(){
  if(!World)return;const Hd=innerHeight,fr={l:0,t:0,r:0,b:0};fr.t=$('#hud').getBoundingClientRect().bottom;
  if(tab==='camp'){const p=$('#camp').getBoundingClientRect();if(innerWidth>=1000)fr.l=p.right;else fr.b=Hd-p.top}
  else{const c=$('#stCard').getBoundingClientRect();fr.b=Hd-c.top}
  World.layout(fr);
}
const paused=()=>!!(state.session&&!state.session.t0);
function worldMode(){if(tab==='camp')return'camp';const s=state.session;return!s?'ready':s.t0?'walk':'rest'}
function fadeThrough(fn){const f=$('#fade');if(reduceMotion){fn();return}f.classList.add('on');setTimeout(()=>{fn();requestAnimationFrame(()=>f.classList.remove('on'))},370)}
function applyMode(instant,dawn){
  const go=()=>{
    document.body.classList.toggle('tab-camp',tab==='camp');document.body.classList.toggle('tab-study',tab==='study');
    document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
    renderStudy.key='';renderAll();
    if(World){World.setMode(worldMode());
      if(paused()){World.jumpClock(1.22);World.setClock(1.22)}
      else{const c=clockTarget();if(dawn&&c<1)World.jumpClock(-.07);World.setClock(c)}}
    layoutWorld()};
  if(instant)go();else fadeThrough(go);
}

/* sessão de estudo */
let wake=null;
function wakeOn(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w}).catch(()=>{})}catch(e){}}
function wakeOff(){try{if(wake){wake.release();wake=null}}catch(e){}}
function commitSession(){const s=state.session;if(!s)return;attribute();const l=state.log[s.day]||(state.log[s.day]={sec:0});l.sec=Math.round((l.sec||0)+sessElapsed());state.session=null}
function startSession(){
  const t=today();let dawn=true;
  if(state.session&&state.session.day!==t)commitSession();
  if(!state.session){sessXp0=xpTotal();state.session={day:t,acc:0,t0:Date.now(),mark:0,sub:curSubj()}}
  else if(!state.session.t0)state.session.t0=Date.now();
  else dawn=false;
  touch();if(state.sound)Music.setOn(true);wakeOn();tab='study';applyMode(false,dawn);
}
function togglePause(){
  const s=state.session;if(!s)return;
  if(s.t0){attribute();s.acc=sessElapsed();s.t0=null;s.mark=s.acc;touch();wakeOff();applyMode(false,false)}
  else{s.t0=Date.now();touch();wakeOn();applyMode(false,true)}
}
let endDawn=false;
function endSession(){
  const s=state.session;if(!s)return;const el=sessElapsed(),day=s.day,wasAdv=(state.log[day]&&state.log[day].sec||0)>=ADV;endDawn=!s.t0;
  commitSession();touch();plan=buildPlan();
  const nowAdv=advanced(day),gained=Math.max(0,xpTotal()-sessXp0),d=plan.days.find(x=>x.key===day),sec=daySec(day);
  $('#resTitle').textContent=nowAdv&&!wasAdv?'Dia conquistado':el<60?'Sessão curtinha':'Sessão encerrada';
  $('#resXp').textContent='+'+gained+' XP';
  $('#resBody').textContent='Você estudou '+fmtDur(Math.max(1,el/60))+' agora. Hoje: '+fmtDur(sec/60)+(d&&d.goal?' de '+fmtDur(d.goal):'')+'.'+(nowAdv?'':' Faltam '+Math.ceil((ADV-sec)/60)+' min para conquistar o dia.');
  $('#result').hidden=false;$('#resOk').focus();wakeOff();
}
function tick(){
  const s=state.session;
  if(s){
    const k=s.day,sec=daySec(k),d=plan.days.find(x=>x.key===k);
    if(sec>=ADV&&!crossed.adv[k]){crossed.adv[k]=1;if(s.t0&&sec<ADV+3){toast('Dia conquistado na jornada: +30 XP');Music.sfx('adv')}}
    if(d&&d.goal&&sec>=d.goal*60){const l=state.log[k]||(state.log[k]={sec:0});if(!l.goal){l.goal=true;touch();toast('Meta do dia batida: +50 XP');Music.sfx('goal')}}
    if(World&&s.t0)World.setClock(clockTarget());
    if(tick.n%4===0)renderHud();
    if(tab==='camp'&&tick.n%40===20)renderCamp();
  }
  if(tab==='study')renderStudy();
  tick.n++;
  const t=today();if(tick.day&&tick.day!==t)applyMode(true,false);tick.day=t;
}
tick.n=0;
function onStateReplaced(){if(!state.subject)state.subject='auto';if(!state.subsec)state.subsec={};applyMode(true,false)}

/* eventos */
document.addEventListener('toggle',e=>{if(e.target&&e.target.id)openDet[e.target.id]=e.target.open;},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){startSession();return}
  if(b.dataset.tab){if(b.dataset.tab!==tab){tab=b.dataset.tab;applyMode(false,false)}return}
  if(b.dataset.sub){attribute();state.subject=b.dataset.sub;if(state.session)state.session.sub=curSubj();touch();renderAll();layoutWorld();return}
  if(b.dataset.topic){const id=b.dataset.topic;if(state.done[id])delete state.done[id];else{attribute();state.done[id]=today();Music.sfx('ok')}if(state.session)state.session.sub=curSubj();touch();renderAll();layoutWorld();return}
  if(b.dataset.undo){delete state.done[b.dataset.undo];touch();renderAll();return}
  if(b.dataset.day){const k=b.dataset.day;state.hours[k]=clamp(hoursFor(k)+Number(b.dataset.h),0,480);touch();renderAll();if(World&&!paused())World.setClock(clockTarget());return}
  if(b.id==='arrive'){const t=today(),l=state.log[t]||(state.log[t]={sec:0});l.arrived=true;touch();if(state.sound)Music.setOn(true);Music.sfx('goal');renderAll();return}
  if(b.id==='grip'){$('#camp').classList.toggle('min');layoutWorld();return}
  if(b.id==='snd'){state.sound=!state.sound;touch();Music.setOn(state.sound);renderHud();return}
  if(b.id==='stPause'){togglePause();return}
  if(b.id==='stEnd'){endSession();return}
  if(b.id==='stDone'){const tp=currentTopic();if(tp){attribute();state.done[tp.id]=today();if(state.session)state.session.sub=curSubj();touch();Music.sfx('ok');toast('Tópico concluído: +20 XP');plan=buildPlan();renderHud();renderStudy()}return}
  if(b.id==='resOk'){$('#result').hidden=true;tab='camp';applyMode(false,endDawn);return}
});
window.addEventListener('resize',()=>layoutWorld());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(!state.session)pullCloud()}});

/* partida */
if(!World)document.body.classList.add('flat');
plan=buildPlan();
if(state.session){tab='study';sessXp0=xpTotal()-Math.floor(sessElapsed()/60)*2;if(state.session.t0)crossed.adv[state.session.day]=daySec(state.session.day)>=ADV?1:0}
if(World)World.start();
applyMode(true,false);
setInterval(tick,250);
initCloud();
})();
</script>
